name: APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip ac
        run: mkdir app && unzip -q derin-app.zip -d app
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android projesi
        working-directory: app
        run: |
          npm install
          npx cap add android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<application android:usesCleartextTraffic="true"#' $M
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n<uses-permission android:name="android.permission.VIBRATE" />\n<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' $M
          npx cap sync android
      - name: APK derle
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Releases'a koy
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: DERIN APK ${{ github.run_number }}
          files: app/android/app/build/outputs/apk/debug/app-debug.apk
